# Rootless HTTP harness. Mount this file as /etc/nginx/conf.d/default.conf and
# the deployment/nginx directory at /etc/nginx/smartcontrol; see deployment.md.
include /etc/nginx/smartcontrol/maps.conf;

server {
    listen 8080;
    server_name localhost;
    root /srv/site;

    include /etc/nginx/smartcontrol/site-rules.conf;
}
