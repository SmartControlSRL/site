# Included in both TLS virtual hosts. Certificate material stays on the VPS and
# is never committed. These paths follow Certbot's conventional layout.
ssl_certificate /etc/letsencrypt/live/smartcontrol.ro/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/smartcontrol.ro/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SmartControlTLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
