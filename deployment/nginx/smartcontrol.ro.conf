# Install as /etc/nginx/sites-available/smartcontrol.ro.conf and symlink from
# sites-enabled. Install this directory's other *.conf files under
# /etc/nginx/smartcontrol/. See docs/deployment.md for the exact procedure.

include /etc/nginx/smartcontrol/maps.conf;

server {
    listen 80;
    listen [::]:80;
    server_name smartcontrol.ro www.smartcontrol.ro;

    # Certbot's webroot challenge remains available during renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://smartcontrol.ro$request_uri;
    }
}

# Canonicalize the alternate host before serving any content. The certificate
# must cover both smartcontrol.ro and www.smartcontrol.ro.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.smartcontrol.ro;

    include /etc/nginx/smartcontrol/tls.conf;
    # Browsers whose entry host is www must learn the HSTS policy from this
    # redirect too, not only after landing on the apex.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 308 https://smartcontrol.ro$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name smartcontrol.ro;
    root /var/www/smartcontrol.ro/current;

    include /etc/nginx/smartcontrol/tls.conf;
    include /etc/nginx/smartcontrol/site-rules.conf;

    # Enable HSTS only after the TLS and canonical-host checks in the deployment
    # runbook pass. This checked-in value is the approved post-readiness state.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
