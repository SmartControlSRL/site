# Included from the nginx http context.
# Keep the /en/ rule before any future regular-expression rules: nginx uses the
# first matching regular expression in a map.
map $uri $smartcontrol_error_document {
    ~^/en(?:/|$) /en/404/index.html;
    default       /404.html;
}

# Astro fingerprints everything below /_astro/. Only those files are immutable.
# HTML and public/ assets keep validators useful so a release or rollback is
# visible without asking visitors to clear their browser cache.
map $uri $smartcontrol_cache_control {
    ~^/_astro/                                              "public, max-age=31536000, immutable";
    ~*\.html$                                               "no-cache";
    ~*\.(?:avif|gif|ico|jpe?g|json|png|svg|txt|webp|xml)$   "public, max-age=3600, must-revalidate";
    default                                                 "no-cache";
}
