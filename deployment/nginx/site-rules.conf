# Included inside the canonical HTTPS server in production and the unprivileged
# HTTP server used by local smoke tests.

index index.html;

# Do not depend on a distribution's implicit MIME defaults.
include /etc/nginx/mime.types;
default_type application/octet-stream;
charset utf-8;
server_tokens off;
etag on;

# gzip is available in the stock nginx package. Brotli can be enabled only when
# the VPS package provides the module; gzip is the required compatible baseline.
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    application/xml+rss
    image/svg+xml
    text/css
    text/plain
    text/xml;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cache-Control $smartcontrol_cache_control always;

# Phase 1 is deliberately report-only. Do not copy this value to an enforcing
# Content-Security-Policy header until the observation and approval steps in
# docs/deployment.md are complete. Inline script is omitted intentionally so
# violations from Astro's current inline bootstrap and JSON-LD are observable.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'none'" always;

# Preserve the original URL and status while choosing the locale-specific
# generated document. The variable form of error_page is supported by nginx
# 1.7.11 and newer.
error_page 404 =404 $smartcontrol_error_document;

location = /404.html {
    internal;
}

location = /en/404/index.html {
    internal;
}

# Error documents are deployment internals rather than public content routes.
location = /404 {
    return 404;
}

location = /en/404 {
    return 404;
}

location = /en/404/ {
    return 404;
}

# Retired overview routes now lead directly to the corresponding homepage section.
location = /servicii {
    return 301 /#servicii;
}

location = /servicii/ {
    return 301 /#servicii;
}

location = /solutii {
    return 301 /#produse;
}

location = /solutii/ {
    return 301 /#produse;
}

location = /en/servicii {
    return 301 /en/#servicii;
}

location = /en/servicii/ {
    return 301 /en/#servicii;
}

location = /en/solutii {
    return 301 /en/#produse;
}

location = /en/solutii/ {
    return 301 /en/#produse;
}

# Astro filenames in this directory are content-hashed. A missing old release
# asset must be a genuine 404, never the HTML application shell.
location ^~ /_astro/ {
    try_files $uri =404;
    access_log off;
}

# Do not expose dotfiles. ACME HTTP-01 challenges are handled by the port-80
# server before its HTTPS redirect and never reach this server.
location ~ /\.(?!well-known(?:/|$)) {
    return 404;
}

# Directory-format output makes nginx's native directory redirect canonicalize
# /servicii -> /servicii/ without creating an application-level redirect hop.
location / {
    try_files $uri $uri/ =404;
}
